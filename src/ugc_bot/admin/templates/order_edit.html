{% extends "sqladmin/edit.html" %}
{% block content %}
{% if eligible_bloggers_count is not none %}
<div class="col-12 mb-2">
  <div class="alert alert-info py-2 mb-0" role="status">
    Креаторов под выборку: <strong>{{ eligible_bloggers_count }}</strong>
  </div>
</div>
{% endif %}
{{ super() }}
<div class="col-12 mt-3">
  <div class="card">
    <div class="card-body">
      <label for="managers" class="form-label fw-bold">Менеджеры (через запятую @username)</label>
      <input type="text" class="form-control" id="managers" name="managers"
             value="{{ managers_value|default('', true) }}"
             placeholder="@username1, @username2">
    </div>
  </div>
</div>
{% endblock %}
