<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Выбор точки на карте</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 1.1rem;
      margin: 0;
      padding: 10px 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    #map {
      flex: 1;
      min-height: 280px;
      width: 100%;
    }
    .hint {
      padding: 8px 12px;
      font-size: 0.9rem;
      color: var(--tg-theme-hint-color, #999);
      flex-shrink: 0;
    }
    #send-btn {
      margin: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      cursor: pointer;
      flex-shrink: 0;
    }
    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Выберите точку на карте</h1>
  <p class="hint">Нажмите на карту, чтобы отметить город или место</p>
  <div id="map"></div>
  <button type="button" id="send-btn" disabled>Отправить выбранную точку</button>

  <script>
    (function() {
      var DEFAULT_LAT = 55.7558;
      var DEFAULT_LON = 37.6173;
      var DEFAULT_ZOOM = 5;

      var mapEl = document.getElementById('map');
      var sendBtn = document.getElementById('send-btn');
      var marker = null;
      var selectedLat = null;
      var selectedLon = null;

      var map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LON], DEFAULT_ZOOM);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      map.on('click', function(e) {
        var lat = e.latlng.lat;
        var lon = e.latlng.lng;
        if (marker) {
          marker.setLatLng(e.latlng);
        } else {
          marker = L.marker(e.latlng).addTo(map);
        }
        selectedLat = lat;
        selectedLon = lon;
        sendBtn.disabled = false;
      });

      sendBtn.addEventListener('click', function() {
        if (selectedLat == null || selectedLon == null) return;
        var payload = JSON.stringify({ lat: selectedLat, lon: selectedLon });
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg && typeof tg.sendData === 'function') {
          tg.sendData(payload);
          if (typeof tg.close === 'function') tg.close();
        }
      });

      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    })();
  </script>
</body>
</html>
