<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Location picker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 { font-size: 1.1rem; margin: 0; padding: 10px 12px; font-weight: 600; flex-shrink: 0; }
    #map { flex: 1; min-height: 280px; width: 100%; }
    .hint {
      padding: 8px 12px;
      font-size: 0.9rem;
      color: var(--tg-theme-hint-color, #999);
      flex-shrink: 0;
    }
    .city-search-row {
      display: flex;
      gap: 8px;
      margin: 0 12px 8px;
      flex-shrink: 0;
    }
    .city-search-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 8px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      margin: 0;
    }
    .city-search-row .btn-search {
      flex-shrink: 0;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--tg-theme-secondary-bg-color, #e0e0e0);
      color: var(--tg-theme-text-color, #000);
      cursor: pointer;
      margin: 0;
    }
    #map-hint.error { color: #c00; }
    #send-btn {
      margin: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      cursor: pointer;
      flex-shrink: 0;
    }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1 id="page-title">…</h1>
  <p class="hint" id="map-hint">…</p>
  <div class="city-search-row">
    <input type="text" id="city-search" placeholder="…" autocomplete="off" />
    <button type="button" class="btn-search" id="btn-city-search">…</button>
  </div>
  <div id="map"></div>
  <button type="button" id="send-btn" disabled>…</button>

  <script>
    (function() {
      var I18N = {
        ru: {
          title: 'Выберите точку на карте',
          hint: 'Нажмите на карту или найдите город',
          placeholder: 'Поиск по городу',
          btn_search: 'Найти',
          btn_send: 'Отправить выбранную точку',
          searching: 'Поиск…',
          enter_city: 'Введите название города',
          city_found: 'Выбрано: ',
          city_not_found: 'Город не найден',
          request_error: 'Ошибка запроса'
        },
        en: {
          title: 'Pick a point on the map',
          hint: 'Tap on the map or search for a city',
          placeholder: 'Search by city',
          btn_search: 'Search',
          btn_send: 'Send selected point',
          searching: 'Searching…',
          enter_city: 'Enter city name',
          city_found: 'Selected: ',
          city_not_found: 'City not found',
          request_error: 'Request error'
        },
        kk: {
          title: 'Картада нүкте таңдаңыз',
          hint: 'Картаға басыңыз немесе қала іздеңіз',
          placeholder: 'Қала бойынша іздеу',
          btn_search: 'Іздеу',
          btn_send: 'Таңдалған нүктені жіберу',
          searching: 'Іздеу…',
          enter_city: 'Қала атауын енгізіңіз',
          city_found: 'Таңдалды: ',
          city_not_found: 'Қала табылмады',
          request_error: 'Сұраныс қатесі'
        },
        be: {
          title: 'Выберыце кропку на карце',
          hint: 'Націсніце на карту або знайдзіце горад',
          placeholder: 'Пошук па горадзе',
          btn_search: 'Знайсці',
          btn_send: 'Адправіць абраную кропку',
          searching: 'Пошук…',
          enter_city: 'Увядзіце назву горада',
          city_found: 'Абрана: ',
          city_not_found: 'Горад не знойдзены',
          request_error: 'Памылка запыту'
        },
        uz: {
          title: 'Xaritada nuqta tanlang',
          hint: 'Xaritaga bosing yoki shahar qidiring',
          placeholder: 'Shahar bo\'yicha qidirish',
          btn_search: 'Qidirish',
          btn_send: 'Tanlangan nuqtani yuborish',
          searching: 'Qidirilmoqda…',
          enter_city: 'Shahar nomini kiriting',
          city_found: 'Tanlandi: ',
          city_not_found: 'Shahar topilmadi',
          request_error: 'So\'rov xatosi'
        }
      };

      var params = new URLSearchParams(window.location.search);
      var locale = params.get('locale') || 'ru';
      var t = I18N[locale] || I18N['ru'];

      document.getElementById('page-title').textContent = t.title;
      document.getElementById('map-hint').textContent = t.hint;
      document.getElementById('city-search').placeholder = t.placeholder;
      document.getElementById('btn-city-search').textContent = t.btn_search;
      document.getElementById('send-btn').textContent = t.btn_send;

      var DEFAULT_LAT = 55.7558;
      var DEFAULT_LON = 37.6173;
      var DEFAULT_ZOOM = 5;

      var base = window.location.origin;
      var tg = window.Telegram && window.Telegram.WebApp;
      var mapEl = document.getElementById('map');
      var sendBtn = document.getElementById('send-btn');
      var mapHint = document.getElementById('map-hint');
      var citySearch = document.getElementById('city-search');
      var btnCitySearch = document.getElementById('btn-city-search');
      var marker = null;
      var selectedLat = null;
      var selectedLon = null;

      function getInitData() {
        return (tg && tg.initData) ? tg.initData : '';
      }

      function parseApiError(detail, fallback) {
        if (typeof detail === 'string') return detail;
        if (Array.isArray(detail) && detail.length > 0) {
          var first = detail[0];
          return (first && first.msg) ? first.msg : JSON.stringify(detail);
        }
        return fallback || t.request_error;
      }

      function api(path, body) {
        var initData = getInitData();
        if (!initData) return Promise.reject(new Error('No initData'));
        var payload = typeof body === 'object' ? Object.assign({ init_data: initData }, body) : { init_data: initData };
        return fetch(base + '/miniapp/api' + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(function(r) {
          if (!r.ok) {
            return r.json().then(function(j) {
              throw new Error(parseApiError(j.detail, r.statusText));
            }).catch(function(e) {
              if (e instanceof SyntaxError) throw new Error(r.statusText || t.request_error);
              throw e;
            });
          }
          return r.json();
        });
      }

      function geocodeForward(query) {
        var initData = getInitData();
        if (initData) {
          return api('/geocode/forward', { city: query });
        }
        return fetch(base + '/miniapp/api/geocode/forward/public', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ city: query })
        }).then(function(r) {
          if (!r.ok) {
            return r.json().then(function(j) {
              throw new Error(parseApiError(j.detail, r.statusText));
            }).catch(function(e) {
              if (e instanceof SyntaxError) throw new Error(r.statusText || t.request_error);
              throw e;
            });
          }
          return r.json();
        });
      }

      function runSearch() {
        var query = (citySearch && citySearch.value || '').trim();
        if (!query) {
          if (mapHint) { mapHint.textContent = t.enter_city; mapHint.className = 'hint'; }
          return;
        }
        if (mapHint) { mapHint.textContent = t.searching; mapHint.className = 'hint'; }
        geocodeForward(query)
          .then(function(data) {
            var lat = data && (typeof data.lat === 'number' ? data.lat : parseFloat(data.lat));
            var lon = data && (typeof data.lon === 'number' ? data.lon : parseFloat(data.lon));
            if (data && !isNaN(lat) && !isNaN(lon)) {
              if (marker) { marker.setLatLng([lat, lon]); } else { marker = L.marker([lat, lon]).addTo(map); }
              map.setView([lat, lon], 12);
              selectedLat = lat;
              selectedLon = lon;
              sendBtn.disabled = false;
              if (mapHint) { mapHint.textContent = t.city_found + (data.city || query); mapHint.className = 'hint'; }
            } else {
              if (mapHint) { mapHint.textContent = t.city_not_found; mapHint.className = 'hint error'; }
            }
          })
          .catch(function(err) {
            if (mapHint) {
              var msg = (err && err.message) ? err.message : t.city_not_found;
              if (msg === 'City could not be found.' || msg.indexOf('could not be found') !== -1) {
                msg = L.city_not_found;
              }
              mapHint.textContent = msg;
              mapHint.className = 'hint error';
            }
          });
      }

      var map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LON], DEFAULT_ZOOM);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(pos) { map.setView([pos.coords.latitude, pos.coords.longitude], 12); },
          function() {},
          { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
        );
      }

      map.on('click', function(e) {
        var lat = e.latlng.lat;
        var lon = e.latlng.lng;
        if (marker) { marker.setLatLng(e.latlng); } else { marker = L.marker(e.latlng).addTo(map); }
        selectedLat = lat;
        selectedLon = lon;
        sendBtn.disabled = false;
        if (mapHint) { mapHint.textContent = t.hint; mapHint.className = 'hint'; }
      });

      if (btnCitySearch) btnCitySearch.addEventListener('click', runSearch);
      if (citySearch) {
        citySearch.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); runSearch(); }
        });
      }

      sendBtn.addEventListener('click', function() {
        if (selectedLat == null || selectedLon == null) return;
        var payload = JSON.stringify({ lat: selectedLat, lon: selectedLon });
        if (tg && typeof tg.sendData === 'function') {
          tg.sendData(payload);
          if (typeof tg.close === 'function') tg.close();
        }
      });

      if (tg) { tg.ready(); tg.expand(); }
    })();
  </script>
</body>
</html>
