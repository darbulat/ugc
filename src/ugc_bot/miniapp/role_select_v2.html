<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UGC — Выбор роли</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b1f3a;
      --bg-2: #112a4f;
      --surface: #16335c;
      --mint: #5eead4;
      --mint-strong: #2dd4bf;
      --text: #f1f5f9;
      --text-soft: #cbd5e1;
      --shadow: 0 10px 30px -10px rgba(0,0,0,0.6);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(1200px 500px at 50% -200px, #1d3b6e 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .logo {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--mint) 0%, #38bdf8 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 26px; color: #0b1f3a;
      box-shadow: var(--shadow);
      margin: 24px auto 18px;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .subtitle {
      text-align: center;
      color: var(--text-soft);
      font-size: 15px;
      margin: 0 0 32px;
      line-height: 1.45;
    }
    .roles {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: auto;
      margin-bottom: auto;
    }
    .role-card {
      background: var(--surface);
      border: 1px solid rgba(94,234,212,0.15);
      border-radius: 18px;
      padding: 20px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      text-align: left;
      font: inherit;
      color: inherit;
      width: 100%;
    }
    .role-card:active { transform: scale(0.985); }
    .role-card:hover { border-color: rgba(94,234,212,0.5); background: var(--bg-2); }
    .role-icon {
      width: 56px; height: 56px;
      flex: 0 0 56px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      background: linear-gradient(135deg, rgba(94,234,212,0.18), rgba(56,189,248,0.12));
      border: 1px solid rgba(94,234,212,0.25);
    }
    .role-text { flex: 1 1 auto; }
    .role-title { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
    .role-desc { font-size: 13px; color: var(--text-soft); margin: 0; line-height: 1.4; }
    .role-arrow {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--mint);
      color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      flex: 0 0 28px;
    }
    .footer {
      text-align: center;
      color: var(--text-soft);
      font-size: 11px;
      margin-top: 24px;
      opacity: 0.7;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">U</div>
    <h1>Добро пожаловать в UGC</h1>
    <p class="subtitle">Выберите роль, чтобы продолжить</p>

    <div class="roles">
      <button class="role-card" id="role-creator">
        <div class="role-icon">🎬</div>
        <div class="role-text">
          <p class="role-title">Я креатор</p>
          <p class="role-desc">Снимаю UGC-видео и зарабатываю на брендах</p>
        </div>
        <div class="role-arrow">→</div>
      </button>

      <button class="role-card" id="role-brand">
        <div class="role-icon">🏷️</div>
        <div class="role-text">
          <p class="role-title">Я бренд</p>
          <p class="role-desc">Заказываю креативы у наших создателей</p>
        </div>
        <div class="role-arrow">→</div>
      </button>

      <button class="role-card hidden" id="role-manager">
        <div class="role-icon">👔</div>
        <div class="role-text">
          <p class="role-title">Я менеджер</p>
          <p class="role-desc">Управляю заказами и креаторами</p>
        </div>
        <div class="role-arrow">→</div>
      </button>
    </div>

    <div class="footer">UGC Platform · v2</div>
  </div>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      const initData = (tg && tg.initData) || '';

      function go(path) {
        window.location.href = path;
      }

      // Fetch /me to determine if user is a manager
      fetch('/miniapp/api/me', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ init_data: initData, platform: 'telegram' }),
      })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (data) {
          if (data && data.is_manager) {
            const mgr = document.getElementById('role-manager');
            if (mgr) mgr.classList.remove('hidden');
          }
        });

      document.getElementById('role-creator').addEventListener('click', function () {
        go('/miniapp/creator_onboarding_v2.html');
      });
      document.getElementById('role-brand').addEventListener('click', function () {
        go('/miniapp/app.html#advertiser');
      });
      document.getElementById('role-manager').addEventListener('click', function () {
        go('/miniapp/app.html#manager');
      });
    })();
  </script>
</body>
</html>
