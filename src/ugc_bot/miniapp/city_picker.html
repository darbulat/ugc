<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Выбор города</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      min-height: 100vh;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 12px 0;
      font-weight: 600;
    }
    .city-search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .city-search-row input {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 10px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      margin: 0;
    }
    .city-search-row input::placeholder {
      color: var(--tg-theme-hint-color, #999);
    }
    .city-search-row .btn-search {
      flex-shrink: 0;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: var(--tg-theme-secondary-bg-color, #e0e0e0);
      color: var(--tg-theme-text-color, #000);
      cursor: pointer;
      margin: 0;
    }
    #search-hint {
      font-size: 0.9rem;
      color: var(--tg-theme-hint-color, #999);
      margin-bottom: 12px;
      min-height: 1.2em;
    }
    #search-hint.error { color: #c00; }
    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
    #list li {
      padding: 14px 12px;
      border-bottom: 1px solid var(--tg-theme-hint-color, #eee);
      cursor: pointer;
      font-size: 16px;
    }
    #list li:active {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    #list li.no-results {
      cursor: default;
      color: var(--tg-theme-hint-color, #999);
    }
    #list li.no-results:active {
      background: transparent;
      color: var(--tg-theme-hint-color, #999);
    }
    .loading { padding: 20px; text-align: center; color: var(--tg-theme-hint-color, #999); }
    .error { padding: 20px; color: #c00; }
  </style>
</head>
<body>
  <h1>Выберите город</h1>
  <div class="city-search-row">
    <input type="text" id="search" placeholder="Поиск по городу" autocomplete="off" />
    <button type="button" class="btn-search" id="btn-city-search">Найти</button>
  </div>
  <p id="search-hint" aria-live="polite"></p>
  <ul id="list">
    <li class="loading">Загрузка списка городов…</li>
  </ul>

  <script>
    (function() {
      var MAX_VISIBLE = 100;
      var base = window.location.origin;
      var tg = window.Telegram && window.Telegram.WebApp;
      var searchEl = document.getElementById('search');
      var listEl = document.getElementById('list');
      var hintEl = document.getElementById('search-hint');
      var btnSearch = document.getElementById('btn-city-search');

      function getInitData() {
        return (tg && tg.initData) ? tg.initData : '';
      }

      function parseApiError(detail, fallback) {
        if (typeof detail === 'string') return detail;
        if (Array.isArray(detail) && detail.length > 0) {
          var first = detail[0];
          return (first && first.msg) ? first.msg : JSON.stringify(detail);
        }
        return fallback || 'Ошибка запроса';
      }

      function api(path, body) {
        var initData = getInitData();
        if (!initData) return Promise.reject(new Error('No initData'));
        var payload = typeof body === 'object' ? Object.assign({ init_data: initData }, body) : { init_data: initData };
        return fetch(base + '/miniapp/api' + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(function(r) {
          if (!r.ok) {
            return r.json().then(function(j) {
              throw new Error(parseApiError(j.detail, r.statusText));
            }).catch(function(e) {
              if (e instanceof SyntaxError) throw new Error(r.statusText || 'Ошибка запроса');
              throw e;
            });
          }
          return r.json();
        });
      }

      function setHint(text, isError) {
        if (!hintEl) return;
        hintEl.textContent = text || '';
        hintEl.className = isError ? 'error' : '';
      }

      function sendCityAndClose(lat, lon) {
        if (tg && typeof tg.sendData === 'function') {
          tg.sendData(JSON.stringify({ lat: lat, lon: lon }));
          if (typeof tg.close === 'function') tg.close();
        }
      }

      function runSearch(query, onSuccess) {
        var q = (query || '').trim();
        if (!q) {
          setHint('Введите название города', false);
          return;
        }
        setHint('Поиск…', false);
        api('/geocode/forward', { city: q })
          .then(function(data) {
            if (data && typeof data.lat === 'number' && typeof data.lon === 'number') {
              if (onSuccess) onSuccess();
              sendCityAndClose(data.lat, data.lon);
            } else {
              setHint('Город не найден', true);
            }
          })
          .catch(function() {
            setHint('Город не найден', true);
          });
      }

      function normalizeForSearch(s) {
        if (!s) return '';
        return s.toLowerCase().replace(/\s+/g, ' ').trim();
      }

      function filterCities(cities, query) {
        if (!query) return cities.slice(0, MAX_VISIBLE);
        var nq = normalizeForSearch(query);
        return cities.filter(function(c) {
          return normalizeForSearch(c.label).indexOf(nq) !== -1 ||
                 normalizeForSearch(c.id).indexOf(nq) !== -1;
        }).slice(0, MAX_VISIBLE);
      }

      function renderList(cities, query) {
        var filtered = filterCities(cities, query);
        listEl.innerHTML = '';
        if (filtered.length === 0) {
          var li = document.createElement('li');
          li.className = 'no-results';
          li.textContent = query ? 'Ничего не найдено' : 'Нет городов';
          listEl.appendChild(li);
          return;
        }
        filtered.forEach(function(city) {
          var li = document.createElement('li');
          li.textContent = city.label;
          li.dataset.id = city.id;
          li.dataset.label = city.label;
          li.addEventListener('click', function() {
            var label = this.dataset.label || this.textContent;
            if (!label) return;
            runSearch(label, function() {});
          });
          listEl.appendChild(li);
        });
      }

      function loadCities() {
        fetch(base + '/miniapp/api/cities')
          .then(function(r) { return r.json(); })
          .then(function(cities) {
            window._cities = Array.isArray(cities) ? cities : [];
            renderList(window._cities, '');
            searchEl.disabled = false;
            searchEl.focus();
          })
          .catch(function() {
            listEl.innerHTML = '<li class="error">Не удалось загрузить список городов. Попробуйте позже.</li>';
          });
      }

      if (btnSearch) {
        btnSearch.addEventListener('click', function() {
          runSearch(searchEl.value);
        });
      }
      searchEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          runSearch(searchEl.value);
        }
      });
      searchEl.addEventListener('input', function() {
        var q = this.value.trim();
        setHint('', false);
        renderList(window._cities || [], q);
      });

      if (tg) {
        tg.ready();
        tg.expand();
      }
      loadCities();
    })();
  </script>
</body>
</html>
