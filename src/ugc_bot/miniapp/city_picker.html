<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>City picker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      min-height: 100vh;
    }
    h1 { font-size: 1.25rem; margin: 0 0 12px 0; font-weight: 600; }
    #search {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 10px;
      margin-bottom: 12px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    #search::placeholder { color: var(--tg-theme-hint-color, #999); }
    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
    #list li {
      padding: 14px 12px;
      border-bottom: 1px solid var(--tg-theme-hint-color, #eee);
      cursor: pointer;
      font-size: 16px;
    }
    #list li:active {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    #list li.no-results { cursor: default; color: var(--tg-theme-hint-color, #999); }
    #list li.no-results:active { background: transparent; color: var(--tg-theme-hint-color, #999); }
    .loading { padding: 20px; text-align: center; color: var(--tg-theme-hint-color, #999); }
    .error { padding: 20px; color: #c00; }
  </style>
</head>
<body>
  <h1 id="page-title">…</h1>
  <input type="text" id="search" placeholder="…" autocomplete="off" disabled />
  <ul id="list"><li class="loading" id="loading-item">…</li></ul>

  <script>
    (function() {
      var I18N = {
        ru: {
          title: 'Выберите город',
          placeholder: 'Начните вводить название города',
          loading: 'Загрузка списка городов…',
          no_results: 'Ничего не найдено',
          no_cities: 'Нет городов',
          load_error: 'Не удалось загрузить список городов. Попробуйте позже.'
        },
        en: {
          title: 'Choose a city',
          placeholder: 'Start typing a city name',
          loading: 'Loading cities…',
          no_results: 'Nothing found',
          no_cities: 'No cities',
          load_error: 'Could not load city list. Please try again later.'
        },
        kk: {
          title: 'Қала таңдаңыз',
          placeholder: 'Қала атауын теріңіз',
          loading: 'Қалалар жүктелуде…',
          no_results: 'Ештеңе табылмады',
          no_cities: 'Қалалар жоқ',
          load_error: 'Қалалар тізімін жүктеу мүмкін болмады. Кейінірек қайталаңыз.'
        },
        be: {
          title: 'Выберыце горад',
          placeholder: 'Пачніце ўводзіць назву горада',
          loading: 'Загрузка спісу гарадоў…',
          no_results: 'Нічога не знойдзена',
          no_cities: 'Няма гарадоў',
          load_error: 'Не ўдалося загрузіць спіс гарадоў. Паспрабуйце пазней.'
        },
        uz: {
          title: 'Shahar tanlang',
          placeholder: 'Shahar nomini kiriting',
          loading: 'Shaharlar yuklanmoqda…',
          no_results: 'Hech narsa topilmadi',
          no_cities: "Shaharlar yo'q",
          load_error: "Shaharlar ro'yxatini yuklab bo'lmadi. Keyinroq urinib ko'ring."
        }
      };

      var params = new URLSearchParams(window.location.search);
      var locale = params.get('locale') || 'ru';
      var L = I18N[locale] || I18N['ru'];

      var MAX_VISIBLE = 100;
      var searchEl = document.getElementById('search');
      var listEl = document.getElementById('list');

      document.getElementById('page-title').textContent = L.title;
      document.getElementById('loading-item').textContent = L.loading;

      function normalizeForSearch(s) {
        if (s == null || s === '') return '';
        return String(s).toLowerCase().replace(/\s+/g, ' ').trim();
      }

      function filterCities(cities, query) {
        if (!query) return cities.slice(0, MAX_VISIBLE);
        var nq = normalizeForSearch(query);
        return cities.filter(function(c) {
          return normalizeForSearch(c.label).indexOf(nq) !== -1 ||
                 normalizeForSearch(c.id).indexOf(nq) !== -1;
        }).slice(0, MAX_VISIBLE);
      }

      function renderList(cities, query) {
        var filtered = filterCities(cities, query);
        listEl.innerHTML = '';
        if (filtered.length === 0) {
          var li = document.createElement('li');
          li.className = 'no-results';
          li.textContent = query ? L.no_results : L.no_cities;
          listEl.appendChild(li);
          return;
        }
        filtered.forEach(function(city) {
          var li = document.createElement('li');
          li.textContent = city.label;
          li.dataset.id = city.id;
          li.addEventListener('click', function() {
            var id = this.dataset.id;
            if (!id) return;
            var tg = window.Telegram && window.Telegram.WebApp;
            if (tg && typeof tg.sendData === 'function') {
              tg.sendData(id);
              if (typeof tg.close === 'function') tg.close();
            }
          });
          listEl.appendChild(li);
        });
      }

      function loadCities() {
        var base = window.location.origin;
        fetch(base + '/miniapp/cities.json')
          .then(function(r) { return r.json(); })
          .then(function(cities) {
            window._cities = cities;
            renderList(cities, '');
            searchEl.placeholder = L.placeholder;
            searchEl.disabled = false;
            searchEl.focus();
          })
          .catch(function() {
            listEl.innerHTML = '';
            var li = document.createElement('li');
            li.className = 'error';
            li.textContent = L.load_error;
            listEl.appendChild(li);
            searchEl.disabled = true;
          });
      }

      searchEl.addEventListener('input', function() {
        renderList(window._cities || [], this.value.trim());
      });

      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
      loadCities();
    })();
  </script>
</body>
</html>
