name: Publish production image
run-name: Publish pinned production image fd8cc21d

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: production-image-fd8cc21d375d3565b68866a3830b56ca41e6b901
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fd8cc21d375d3565b68866a3830b56ca41e6b901
          fetch-depth: 0

      - name: Verify pinned commit belongs to main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          revision=$(git rev-parse HEAD)
          test "$revision" = fd8cc21d375d3565b68866a3830b56ca41e6b901
          main=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          git fetch --no-tags origin "$main"
          git merge-base --is-ancestor "$revision" "$main"
          gh api "repos/$GH_REPO/actions/workflows/lint-test.yml/runs?head_sha=$revision&event=push" \
            --jq '.workflow_runs | any(.conclusion == "success")' | grep -qx true

      - name: Build and verify the merged image
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir release
          revision=$(git rev-parse HEAD)
          image="ghcr.io/$GH_REPO/app:$revision"
          docker build --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.source=https://github.com/$GH_REPO" \
            --tag "$image" .
          bash tests/monitoring/check_admin_image_import.sh "$image"
          printf '%s\n' "$image" > release/image-reference.txt

      - name: Publish the verified image and deployment archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          image=$(cat release/image-reference.txt)
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          docker push "$image"
          docker image save "$image" | gzip -1 > release/image.tar.gz
          test -z "$(git ls-tree --name-only HEAD -- .env)"
          git archive --format=tar.gz --output=release/source.tar.gz HEAD
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          archive = pathlib.Path('release/image.tar.gz')
          reference = pathlib.Path('release/image-reference.txt').read_text().strip()
          image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', reference]))[0]
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          manifest = {
              'revision': image['Config']['Labels']['org.opencontainers.image.revision'],
              'image_id': image['Id'],
              'registry_reference': reference,
              'registry_digests': image['RepoDigests'],
              'archive_sha256': digest,
              'source_archive_sha256': hashlib.file_digest(
                  pathlib.Path('release/source.tar.gz').open('rb'), 'sha256'
              ).hexdigest(),
          }
          pathlib.Path('release/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          docker logout ghcr.io

      - uses: actions/upload-artifact@v4
        with:
          name: production-image-fd8cc21d375d3565b68866a3830b56ca41e6b901
          path: release/
          retention-days: 30
          if-no-files-found: error
