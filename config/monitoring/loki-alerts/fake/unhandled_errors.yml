groups:
  - name: unhandled_errors
    interval: 1m
    rules:
      - alert: UnhandledErrorInService
        expr: |
          sum by (service) (
            count_over_time(
              {log_scope="compose_service", service=~"app|app_2|admin|migrate|instagram_webhook|kafka_consumer|combined-scheduler|outbox_processor|instagram_stats_scheduler|instagram_stats_collector_scheduler|max_bot"}
              |~ "Traceback \\(most recent call last\\)|Exception was never retrieved"
              [5m]
            )
          ) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Unhandled error in {{ $labels.service }}"
          description: "Traceback or unhandled exception in service {{ $labels.service }}"
