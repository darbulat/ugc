groups:
  - name: host
    rules:
      - alert: HostHighCpuLoad
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High CPU usage on {{ $labels.instance }}
          description: CPU usage is above 85% for 5 minutes.

      - alert: HostOutOfMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Low memory on {{ $labels.instance }}
          description: Available memory is below 10%.

      - alert: HostLowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Low disk space on {{ $labels.instance }}
          description: Disk free space is below 15%.

  - name: application
    rules:
      - alert: ApplicationDown
        expr: up{job="ugc-bot"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Application is down
          description: Application metrics endpoint is unreachable for 2 minutes.

      - alert: ApplicationHighErrorRate
        expr: rate(ugc_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: High error rate in application
          description: Error rate is {{ $value | humanize }} errors/sec for 5 minutes.

      - alert: SLOErrorBudgetBurnRateFast
        expr: '((job:slo_errors:ratio_rate1h{job="ugc-bot"} > 0.0144 and job:slo_errors:ratio_rate5m{job="ugc-bot"} > 0.0144) or (job:slo_errors:ratio_rate6h{job="ugc-bot"} > 0.006 and job:slo_errors:ratio_rate30m{job="ugc-bot"} > 0.006))'
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: SLO error budget burning fast
          description: Error budget consumption exceeds 2% (1h) or 5% (6h). SLO 99.9%.

      - alert: SLOErrorBudgetBurnRateSlow
        expr: '((job:slo_errors:ratio_rate24h{job="ugc-bot"} > 0.003 and job:slo_errors:ratio_rate2h{job="ugc-bot"} > 0.003) or (job:slo_errors:ratio_rate3d{job="ugc-bot"} > 0.001 and job:slo_errors:ratio_rate6h{job="ugc-bot"} > 0.001))'
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: SLO error budget burning slowly
          description: Error budget consumption exceeds 10% over 3 days. SLO 99.9%.

      - alert: ApplicationHighLatency
        expr: 'histogram_quantile(0.95, sum(rate(ugc_http_request_duration_seconds_bucket[5m])) by (le, path)) > 2'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High request latency detected
          description: 95th percentile HTTP latency is {{ $value | humanize }}s for 10 minutes.

      - alert: HighPaymentFailureRate
        expr: '(rate(ugc_payment_failed_total[15m]) / (rate(ugc_orders_created_total[15m]) + 1)) > 0.1'
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: High payment failure rate
          description: Payment failure rate is {{ $value | humanizePercentage }} for 15 minutes.

      - alert: HighComplaintRate
        expr: 'rate(ugc_complaints_created_total[1h]) > 2 * rate(ugc_complaints_created_total[1h] offset 24h)'
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: High complaint rate
          description: Complaint rate more than doubled compared to yesterday.

  - name: telegram
    rules:
      - alert: TelegramWebhookRejectRate
        expr: '(sum(rate(ugc_http_requests_total{path="/webhook/telegram",status=~"4.."}[15m])) / (sum(rate(ugc_http_requests_total{path="/webhook/telegram"}[15m])) + 1)) > 0.1'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: High Telegram webhook reject rate
          description: More than 10% of webhook requests returned 4xx in 15 minutes.

      - alert: TelegramRateLimitHit
        expr: increase(ugc_telegram_rate_limit_hits_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Telegram API rate limit hit
          description: Telegram API rate limit was triggered in the last 5 minutes.

      - alert: TelegramApiErrors
        expr: rate(ugc_telegram_api_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Telegram API errors
          description: Telegram API error rate is {{ $value | humanize }}/sec for 5 minutes.

