# Template file. Rendered by alertmanager_renderer with envsubst.
global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by:
    - alertname
    - instance
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: telegram_critical
      matchers:
        - severity="critical"
      continue: false

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - instance

# Escape HTML specials so Telegram parse_mode=HTML does not break on labels/annotations.
# Order matters: escape & first to avoid double-escaping &lt; etc.
receivers:
  - name: telegram
    telegram_configs:
      - bot_token: ${TELEGRAM_BOT_TOKEN}
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: HTML
        send_resolved: true
        message: |-
          <b>Status:</b> {{ .Status }}
          <b>Alert:</b> {{ .CommonLabels.alertname | reReplaceAll "&" "&amp;" | reReplaceAll "<" "&lt;" | reReplaceAll ">" "&gt;" }}
          {{ range .Alerts -}}
          <b>Instance:</b> {{ .Labels.instance | reReplaceAll "&" "&amp;" | reReplaceAll "<" "&lt;" | reReplaceAll ">" "&gt;" }}
          <b>Summary:</b> {{ .Annotations.summary | reReplaceAll "&" "&amp;" | reReplaceAll "<" "&lt;" | reReplaceAll ">" "&gt;" }}
          <b>Description:</b> {{ .Annotations.description | reReplaceAll "&" "&amp;" | reReplaceAll "<" "&lt;" | reReplaceAll ">" "&gt;" }}
          {{ end }}
  - name: telegram_critical
    telegram_configs:
      - bot_token: ${TELEGRAM_BOT_TOKEN}
        chat_id: ${TELEGRAM_CRITICAL_CHAT_ID}
        parse_mode: HTML
        send_resolved: true
        message: |-
          <b>Status:</b> {{ .Status }}
          <b>Severity:</b> CRITICAL
          <b>Alert:</b> {{ .CommonLabels.alertname | reReplaceAll "&" "&amp;" | reReplaceAll "<" "&lt;" | reReplaceAll ">" "&gt;" }}
          {{ range .Alerts -}}
          <b>Instance:</b> {{ .Labels.instance | reReplaceAll "&" "&amp;" | reReplaceAll "<" "&lt;" | reReplaceAll ">" "&gt;" }}
          <b>Summary:</b> {{ .Annotations.summary | reReplaceAll "&" "&amp;" | reReplaceAll "<" "&lt;" | reReplaceAll ">" "&gt;" }}
          <b>Description:</b> {{ .Annotations.description | reReplaceAll "&" "&amp;" | reReplaceAll "<" "&lt;" | reReplaceAll ">" "&gt;" }}
          {{ end }}
