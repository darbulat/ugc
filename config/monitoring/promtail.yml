server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project, __meta_docker_container_label_com_docker_compose_oneoff, __meta_docker_container_label_ugc_log_scope]
        regex: '[^;]+;(?i:false);'
        target_label: log_scope
        replacement: compose_service
      - source_labels: [__meta_docker_container_label_com_docker_compose_oneoff]
        regex: '(?i:true)'
        target_label: log_scope
        replacement: compose_oneoff
      - source_labels: [__meta_docker_container_label_ugc_log_scope]
        regex: release_check
        target_label: log_scope
        replacement: release_check
      - source_labels: [__meta_docker_container_label_ugc_log_scope]
        regex: release_check
        target_label: service
        replacement: release_check
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
      - source_labels: [__meta_docker_container_log_path]
        target_label: __path__
    pipeline_stages:
      - docker: {}
