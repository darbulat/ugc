# PgBouncer config reference for docker-compose stack.
# In production the edoburu/pgbouncer image generates config from env (DATABASE_URL,
# LISTEN_PORT=6432, POOL_MODE=session) and populates userlist for backend auth.
# App services connect to pgbouncer:6432; backup and postgres_exporter use db:5432.

[databases]
ugc = host=db port=5432 dbname=ugc

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 1000
default_pool_size = 25
# Avoid "unsupported startup parameter" from psycopg, DBeaver, JDBC and other clients
ignore_startup_parameters = extra_float_digits,options
