# Logical replication (publisher) for replicating to Beget cloud DB.
# These settings are applied via docker-compose db service command;
# this file is the source of truth for the repository.

wal_level = logical
max_replication_slots = 4
max_wal_senders = 4
listen_addresses = '*'

# PITR: WAL archiving to shared volume (sidecar uploads to S3).
# archive_command copies completed WAL segments to /wal_archive/ (Docker volume
# shared with db_backup service).  archive_timeout forces a segment switch
# every 60 s so WAL is archived promptly even under low write load.
archive_mode = on
archive_command = 'test -f /wal_archive/%f || cp %p /wal_archive/%f'
archive_timeout = 60
