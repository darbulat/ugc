 [project]
 name = "ugc-bot"
 version = "0.1.0"
 description = "Telegram bot MVP for UGC matching"
 requires-python = ">=3.13,<3.14"
dependencies = [
 "pydantic>=2.11.5,<3.0.0",
 "pydantic-settings>=2.2.1,<3.0.0",
 "aiogram>=3.4.1,<4.0.0",
 "aiokafka>=0.13.0,<1.0.0",
 "redis>=7.2.0,<8.0.0",
 "fastapi>=0.110.0,<1.0.0",
 "sqladmin>=0.16.0,<1.0.0",
 "jinja2>=3.1.3,<4.0.0",
 "itsdangerous>=2.1.2,<3.0.0",
 "python-multipart>=0.0.9,<1.0.0",
 "uvicorn>=0.30.0,<1.0.0",
 "SQLAlchemy>=2.0.25,<3.0.0",
 "alembic>=1.13.1,<2.0.0",
 "psycopg[binary]>=3.1.18,<4.0.0",
 "httpx>=0.25.0,<1.0.0",
 "curl-cffi>=0.5.0,<1.0.0",
 "cffi>=2.0.0",
 "cryptography>=46.0.4",
 "prometheus-client>=0.21.0,<1.0.0",
 "argon2-cffi>=25.0.0",
 "boto3>=1.35.0,<1.36.0",
 "aiograpi>=0.0.4",
 "geoalchemy2[shapely]>=0.14.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2,<10.0.0",
  "pytest-asyncio>=1.3.0,<2.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "httpx>=0.25.0,<1.0.0",
  "ruff>=0.15.2,<1.0.0",
  "mypy>=1.10.0,<2.0.0",
  "aiosqlite>=0.19.0,<1.0.0",
  "greenlet>=3.3.0",
  "pytest-timeout>=2.4.0",
  "pytest-playwright>=0.4.0",
]
telegram-e2e = [
  "telethon>=1.36.0",
]

 [build-system]
 requires = ["setuptools>=68"]
 build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
timeout = 5
timeout_method = "signal"
# ResourceWarnings from test teardown order (unclosed loop/DB) are not app bugs.
filterwarnings = [
  "ignore:unclosed event loop:ResourceWarning",
  "ignore:unclosed database:ResourceWarning",
]
markers = [
  "integration: requires external services like Postgres",
  "e2e: end-to-end tests with browser (Playwright)",
  "e2e_telegram: E2E with real Telegram (requires bot token, Telethon credentials)",
]

# Used by standalone `coverage report`. For pytest-cov use --cov-fail-under=98 (see Makefile).
[tool.coverage.run]
omit = [
    "*/bot/max/handlers/*",
    "*/max_webhook_app.py",
]

[tool.coverage.report]
fail_under = 98
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "RET", "C90", "TID252", "I"]
extend-select = ["PLR0911", "PLR0912", "PLR0913"]
extend-ignore = ["PLR0911", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PLR0911", "C901"]
"src/ugc_bot/bot/texts/defaults/**/*.py" = ["E501"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
