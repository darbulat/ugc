# App services connect to PostgreSQL via PgBouncer (pgbouncer:6432). db_backup and
# postgres_exporter use direct connection to db:5432. pool_mode=session in pgbouncer.
services:
  app:
    image: ugc-app:latest
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    expose:
      - "9999"
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    command:
      - uvicorn
      - ugc_bot.telegram_webhook_app:app
      - --host
      - "0.0.0.0"
      - --port
      - "9999"
      - --log-config
      - config/uvicorn_log_config.json
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9999/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  app_2:
    image: ugc-app:latest
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    expose:
      - "9999"
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    command:
      - uvicorn
      - ugc_bot.telegram_webhook_app:app
      - --host
      - "0.0.0.0"
      - --port
      - "9999"
      - --log-config
      - config/uvicorn_log_config.json
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9999/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  max_bot:
    image: ugc-app:latest
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    expose:
      - "8003"
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - ugc_bot.max_webhook_app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8003"
      - --log-config
      - config/uvicorn_log_config.json
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  admin:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        python scripts/generate_product_flowchart.py &&
        exec uvicorn ugc_bot.admin.app:app \
          --host 0.0.0.0 \
          --port 8001 \
          --log-config config/uvicorn_log_config.json \
          --proxy-headers \
          --forwarded-allow-ips '127.0.0.1,172.16.0.0/12,10.0.0.0/8'
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - default

  instagram_webhook:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    command:
      [
        "uvicorn",
        "ugc_bot.instagram_webhook_app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--log-config",
        "config/uvicorn_log_config.json",
      ]
    expose:
      - "8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - default

  nginx:
    image: nginx:1.28-alpine
    environment:
      DOMAIN: ${DOMAIN:-bot.usemycontent.ru}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl_cert.conf.template:/etc/nginx/templates/ssl_cert.conf.template:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command:
      - /bin/sh
      - -c
      - |
        envsubst '$${DOMAIN}' < /etc/nginx/templates/ssl_cert.conf.template > /etc/nginx/conf.d/ssl_cert.conf &&
        exec nginx -g 'daemon off;'
    depends_on:
      admin:
        condition: service_healthy
      instagram_webhook:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - default

  kafka_consumer:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      kafka:
        condition: service_healthy
    command: ["python", "-m", "ugc_bot.kafka_consumer"]
    restart: unless-stopped

  feedback_scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    command: ["python", "-m", "ugc_bot.feedback_scheduler"]
    restart: unless-stopped

  role_reminder_scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    command: ["python", "-m", "ugc_bot.role_reminder_scheduler"]
    restart: unless-stopped

  referral_reconciliation_scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    command: ["python", "-m", "ugc_bot.referral_reconciliation_scheduler"]
    restart: unless-stopped

  outbox_processor:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      kafka:
        condition: service_healthy
    command: ["python", "-m", "ugc_bot.outbox_processor"]
    restart: unless-stopped

  instagram_stats_scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    command: ["python", "-m", "ugc_bot.instagram_stats_scheduler"]
    restart: unless-stopped

  instagram_stats_collector_scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
      INSTAGRAM_STATS_AIOGRAPI_SESSION_PATH: /app/instagram_session/.instagram_session.json
    volumes:
      - instagram_session_data:/app/instagram_session
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    command: ["python", "-m", "ugc_bot.instagram_stats_collector_scheduler"]
    restart: unless-stopped

  wal_archive_init:
    image: alpine:3.20
    volumes:
      - wal_archive:/wal_archive
    command: ["sh", "-c", "chown 999:999 /wal_archive && chmod 750 /wal_archive"]
    restart: "no"

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ugc}
      POSTGRES_USER: ${POSTGRES_USER:-ugc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ugc}
    ports:
      - "65432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - wal_archive:/wal_archive
      - ./config/postgres/replication.conf:/etc/postgresql/replication.conf:ro
    depends_on:
      wal_archive_init:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - listen_addresses=*
      - -c
      - archive_mode=on
      - -c
      - archive_command=test -f /wal_archive/%f || cp %p /wal_archive/%f
      - -c
      - archive_timeout=60
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-ugc}\" -d \"$${POSTGRES_DB:-ugc}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@db:5432/${POSTGRES_DB:-ugc}
      AUTH_TYPE: plain
      LISTEN_PORT: 6432
      POOL_MODE: session
    volumes:
      - ./config/postgres/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "26432:6432"
    expose:
      - "6432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Port 6379 not published: only app/admin containers use redis:6379 (no external access)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    expose:
      - "2181"
    healthcheck:
      # Confluent image only whitelists "srvr" by default, not "ruok"
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Connections || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    expose:
      - "9092"
      - "9093"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./config/monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=${PROMETHEUS_EXTERNAL_URL:-https://${DOMAIN:-bot.usemycontent.ru}/prometheus/}"
      - "--web.route-prefix=/"
    expose:
      - "9090"
    depends_on:
      - node_exporter
      - cadvisor
      - alertmanager
    restart: unless-stopped
    networks:
      - default

  alertmanager_renderer:
    image: alpine:3.20
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_CRITICAL_CHAT_ID: ${TELEGRAM_CRITICAL_CHAT_ID}
    volumes:
      - ./config/monitoring/alertmanager.yml:/templates/alertmanager.yml:ro
      - alertmanager_config:/etc/alertmanager
    command:
      [
        "sh",
        "-c",
        "apk add --no-cache gettext >/dev/null && envsubst < /templates/alertmanager.yml > /etc/alertmanager/alertmanager.yml",
      ]
    restart: "no"
    networks:
      - default

  alertmanager:
    image: prom/alertmanager:latest
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_CRITICAL_CHAT_ID: ${TELEGRAM_CRITICAL_CHAT_ID}
    volumes:
      - alertmanager_config:/etc/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    depends_on:
      alertmanager_renderer:
        condition: service_completed_successfully
    expose:
      - "9093"
    restart: unless-stopped
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${DOMAIN:-bot.usemycontent.ru}/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LOG_LEVEL: "warn"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./config/monitoring/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - default

  node_exporter:
    image: prom/node-exporter:latest
    command:
      - "--path.rootfs=/host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    restart: unless-stopped
    networks:
      - default

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    networks:
      - default

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_URI: "db:5432/${POSTGRES_DB:-ugc}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-ugc}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-ugc}
    env_file: .env
    volumes:
      - ./config/postgres/postgres_exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
    command:
      - --config.file=/etc/postgres_exporter/postgres_exporter.yml
    expose:
      - "9187"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  loki:
    image: grafana/loki:latest
    command:
      - "-config.file=/etc/loki/loki.yml"
      - "-log.level=warn"
    volumes:
      - ./config/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - ./config/monitoring/loki-alerts:/loki/rules:ro
      - loki_data:/loki
    expose:
      - "3100"
    restart: unless-stopped
    networks:
      - default

  promtail:
    image: grafana/promtail:latest
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ./config/monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - default

  db_backup:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@db:5432/${POSTGRES_DB:-ugc}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ugc}
      POSTGRES_USER: ${POSTGRES_USER:-ugc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ugc}
      BACKUP_DIR: /backups
      BASE_BACKUP_DIR: /backups/base
      WAL_ARCHIVE_DIR: /wal_archive
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      PITR_ENABLED: ${PITR_ENABLED:-true}
      S3_BACKUP_ENABLED: ${S3_BACKUP_ENABLED:-false}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.ru1.storage.beget.cloud}
      S3_BUCKET: ${S3_BUCKET:-97596cccd207-ugc-s3}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - backup_data:/backups
      - wal_archive:/wal_archive
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/scripts/backup_loop.sh"]
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres_data:
  redis_data:
  certbot_data:
  certbot_www:
  prometheus_data:
  grafana_data:
  alertmanager_config:
  loki_data:
  backup_data:
  wal_archive:
  instagram_session_data:

networks:
  default:
    driver: bridge