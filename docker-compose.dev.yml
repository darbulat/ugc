# no backup service by default.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Ensure certbot has been run for your DOMAIN so certs exist in certbot_data.
# To start backup in dev: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile backup up -d

services:
  # Exclude from default run in dev; start with: --profile backup
  db_backup:
    profiles:
      - backup

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ugc}:${POSTGRES_PASSWORD:-ugc}@pgbouncer:6432/${POSTGRES_DB:-ugc}
      INSTAGRAM_STATS_AIOGRAPI_SESSION_PATH: /app/instagram_session/.instagram_session.json
    volumes:
      - instagram_session_data:/app/instagram_session
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    command: ["python", "-m", "ugc_bot.worker"]
    restart: unless-stopped
