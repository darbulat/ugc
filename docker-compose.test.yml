# Docker Compose for running all tests (unit, integration, E2E).
# Use: docker compose -f docker-compose.test.yml run --rm test
#      docker compose -f docker-compose.test.yml run --rm e2e
#      docker compose -f docker-compose.test.yml run --rm test-all  (unit + integration + e2e in one run)

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ugc_test
      POSTGRES_USER: ugc
      POSTGRES_PASSWORD: ugc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugc -d ugc_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate_test:
    build: *app-build
    environment:
      DATABASE_URL: postgresql+psycopg://ugc:ugc@db_test:5432/ugc_test
    depends_on:
      db_test:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  admin_test:
    build: *app-build
    environment:
      BOT_TOKEN: test-token
      DATABASE_URL: postgresql+psycopg://ugc:ugc@db_test:5432/ugc_test
      ADMIN_USERNAME: test_admin
      ADMIN_PASSWORD: test_pass
      ADMIN_SECRET: test_secret
      KAFKA_ENABLED: "false"
      FEEDBACK_ENABLED: "false"
    depends_on:
      migrate_test:
        condition: service_completed_successfully
    command:
      - uvicorn
      - ugc_bot.admin.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Telegram bot (webhook app) for e2e_telegram tests. Requires WEBHOOK_BASE_URL, WEBHOOK_SECRET, TELEGRAM_E2E_BOT_TOKEN in .env.
  app:
    build: *app-build
    env_file: .env
    environment:
      BOT_TOKEN: ${TELEGRAM_E2E_BOT_TOKEN:-}
      DATABASE_URL: postgresql+psycopg://ugc:ugc@db_test:5432/ugc_test
      KAFKA_ENABLED: "false"
      FEEDBACK_ENABLED: "false"
      USE_REDIS_STORAGE: "false"
    expose:
      - "9999"
    depends_on:
      migrate_test:
        condition: service_completed_successfully
    command:
      - uvicorn
      - ugc_bot.telegram_webhook_app:app
      - --host
      - "0.0.0.0"
      - --port
      - "9999"
      - --log-config
      - config/uvicorn_log_config.json
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9999/health', timeout=5)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: "no"

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      E2E_BASE_URL: http://admin_test:8001
    depends_on:
      admin_test:
        condition: service_healthy
    command: ["python", "-m", "pytest", "tests/e2e", "-v", "-m", "e2e", "--timeout=90"]
    restart: "no"

  # One command: unit + integration, e2e (Playwright), then e2e_telegram if TELEGRAM_E2E_* in .env
  test-all:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      E2E_BASE_URL: http://admin_test:8001
      TELEGRAM_E2E_BOT_TOKEN: ${TELEGRAM_E2E_BOT_TOKEN:-}
      TELEGRAM_E2E_BOT_USERNAME: ${TELEGRAM_E2E_BOT_USERNAME:-}
      TELEGRAM_E2E_API_ID: ${TELEGRAM_E2E_API_ID:-}
      TELEGRAM_E2E_API_HASH: ${TELEGRAM_E2E_API_HASH:-}
      TELEGRAM_E2E_PHONE: ${TELEGRAM_E2E_PHONE:-}
      E2E_DATABASE_URL: ${E2E_DATABASE_URL:-}
    volumes:
      - e2e_telethon_session:/app/tests/e2e/.telethon_session
    depends_on:
      admin_test:
        condition: service_healthy
      app:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python -m pytest -m "not e2e" --cov=ugc_bot --cov-report=term-missing && \
        python -m pytest tests/e2e -v -m e2e --timeout=90 && \
        python -m pytest tests/e2e -v -m e2e_telegram --timeout=90
    restart: "no"

  test:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: ["python", "-m", "pytest", "-m", "not e2e", "--cov=ugc_bot", "--cov-report=term-missing"]
    restart: "no"

  # E2E with real Telegram: bot (app) must be running. Requires TELEGRAM_E2E_*, WEBHOOK_BASE_URL, WEBHOOK_SECRET in .env.
  # First run: make e2e-telegram-docker-auth (enter code), then make e2e-telegram-docker
  e2e-telegram:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      TELEGRAM_E2E_BOT_TOKEN: ${TELEGRAM_E2E_BOT_TOKEN:-}
      TELEGRAM_E2E_BOT_USERNAME: ${TELEGRAM_E2E_BOT_USERNAME:-}
      TELEGRAM_E2E_API_ID: ${TELEGRAM_E2E_API_ID:-}
      TELEGRAM_E2E_API_HASH: ${TELEGRAM_E2E_API_HASH:-}
      TELEGRAM_E2E_PHONE: ${TELEGRAM_E2E_PHONE:-}
      E2E_DATABASE_URL: ${E2E_DATABASE_URL:-}
    volumes:
      - e2e_telethon_session:/app/tests/e2e/.telethon_session
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "-m", "pytest", "tests/e2e", "-m", "e2e_telegram", "-v", "--timeout=90"]
    restart: "no"

volumes:
  e2e_telethon_session:
