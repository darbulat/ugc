# SSL certificate paths (fallback when not using docker-compose).
# In docker-compose, ssl_cert.conf is generated at container start from
# ssl_cert.conf.template and DOMAIN env — set DOMAIN in .env for your domain.
ssl_certificate /etc/letsencrypt/live/bot.usemycontent.ru/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/bot.usemycontent.ru/privkey.pem;
